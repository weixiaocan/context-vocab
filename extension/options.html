<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>生词卡设置</title>
  <style>
    body{max-width:560px;margin:48px auto;padding:0 20px;color:#252723;font:15px/1.6 system-ui,sans-serif}
    h1{font-size:24px}label{display:block;margin:20px 0 6px;font-weight:650}
    input{width:100%;box-sizing:border-box;padding:10px 12px;border:1px solid #bbb;border-radius:8px;font:inherit}
    button{margin-top:22px;padding:10px 20px;border:0;border-radius:8px;background:#526849;color:white;font:inherit;cursor:pointer}
    #status{margin-left:12px;color:#526849}
  </style>
</head>
<body>
  <h1>生词卡设置</h1>
  <label for="serverUrl">服务器地址</label>
  <input id="serverUrl" type="url" placeholder="https://vocab.example.com">
  <label for="accessToken">访问密钥</label>
  <input id="accessToken" type="password" autocomplete="off">
  <button id="save" type="button">保存</button><span id="status"></span>
  <script src="options.js"></script>
</body>
</html>
